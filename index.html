<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compréhension orale — M. Mahmoud Moemen</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#172033}
.hero{padding:30px 20px;color:#fff;text-align:center;background:linear-gradient(135deg,#071a52,#0055a4 50%,#ef4135);border-bottom:6px solid #fff}
.hero h1{margin:0;font-size:34px}.hero p{margin:8px 0}.name{font-size:20px;font-weight:700}
.wrap{max-width:900px;margin:24px auto;padding:0 16px}
.panel,.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 8px 25px #00000012}
.instruction{font-size:18px;font-weight:700;line-height:1.5}
.card h2{margin:0 0 14px;direction:ltr;text-align:left;font-size:22px}
.audio-row{margin:0 0 18px;padding:0 0 16px;border-bottom:1px solid #e3e8ef}
audio{display:block;width:100%;max-width:100%}
.plays{display:block;margin-top:8px;color:#566;font-size:14px}
.options{direction:ltr;text-align:left}
.option{display:block;padding:12px;margin:8px 0;border:1px solid #dde3ec;border-radius:10px;cursor:pointer;line-height:1.4}
.option:hover{background:#f5f8fc}
.submit{width:100%;border:0;border-radius:12px;background:#071a52;color:#fff;font-weight:700;font-size:19px;padding:15px;cursor:pointer}
.submit:disabled{opacity:.6;cursor:not-allowed}
.result{display:none}.score{font-size:26px;font-weight:800}
.review{border-top:1px solid #ddd;margin-top:16px;padding-top:14px;line-height:1.6}
.correct{color:#16823b}.wrong{color:#c62828}
.sentence{margin-top:8px;padding:10px;border-radius:10px;background:#f0f4f8;direction:ltr;text-align:left}
.notice{color:#8a5a00;background:#fff7e6;padding:12px;border-radius:10px;margin-top:10px}
input[type=text]{width:100%;padding:12px;border:1px solid #ccd3df;border-radius:10px;font-size:16px}
.loading{text-align:center;padding:24px;font-weight:700}
</style>
</head>
<body>
<header class="hero">
  <div style="font-size:28px">🇫🇷 🗼 🇫🇷</div>
  <h1 id="testTitle">Compréhension orale</h1>
  <p id="testSubtitle">Écoutez et choisissez la bonne réponse.</p>
  <div class="name">M. Mahmoud Moemen</div>
</header>

<main class="wrap">
<section class="panel">
  <label for="studentName"><strong>Nom de l'élève</strong></label>
  <input id="studentName" type="text" maxlength="120" placeholder="Écrivez votre nom">
  <p class="instruction" id="instruction">Chargement du test…</p>
</section>

<div id="quiz"><div class="panel loading">Chargement du test…</div></div>
<button class="submit" id="submit" type="button" disabled>Voir le résultat</button>
<section class="panel result" id="result" aria-live="polite"></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let TEST = null;
let QUESTION_BANK = [];
let PLAY_LIMIT = 3;
let playCounts = [];

const quiz = document.getElementById('quiz');
const result = document.getElementById('result');
const submitBtn = document.getElementById('submit');

function esc(value){
  return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}

function showError(message){
  quiz.innerHTML = '<section class="panel notice">'+esc(message)+'</section>';
  submitBtn.disabled = true;
}

async function loadTest(){
  const t = await sb.from('published_tests').select('id,title,instruction,play_limit').eq('id',TEST_ID).maybeSingle();
  if(t.error) throw new Error(t.error.message);
  if(!t.data) throw new Error('Le test n’est pas publié ou il est introuvable.');
  TEST = t.data;
  PLAY_LIMIT = Math.max(0, Number(TEST.play_limit ?? 0));

  document.getElementById('testTitle').textContent = TEST.title || 'Compréhension orale';
  document.getElementById('instruction').textContent = TEST.instruction || 'Écoutez d’abord le fichier audio, puis choisissez la bonne réponse.';

  const q = await sb.from('published_questions').select('id,test_id,position,audio_url,question_text,options').eq('test_id',TEST_ID).order('position');
  if(q.error) throw new Error(q.error.message);
  QUESTION_BANK = (q.data || []).map(x => ({
    id:x.id,
    position:x.position,
    audio:x.audio_url,
    question:x.question_text,
    options:Array.isArray(x.options) ? x.options : Object.values(x.options || {})
  }));
  if(!QUESTION_BANK.length) throw new Error('Aucune question active dans ce test.');
  playCounts = Array(QUESTION_BANK.length).fill(0);
  renderQuiz();
  submitBtn.disabled = false;
}

function renderQuiz(){
  quiz.innerHTML='';
  QUESTION_BANK.forEach((q,i)=>{
    const card=document.createElement('section');
    card.className='card';

    const audioRow=document.createElement('div');
    audioRow.className='audio-row';

    const audio=document.createElement('audio');
    audio.controls=true;
    audio.preload='none';
    audio.src=q.audio || '';
    audio.setAttribute('aria-label','Audio de la question '+(i+1));

    const plays=document.createElement('span');
    plays.className='plays';
    plays.textContent='Écoutes : 0 / '+PLAY_LIMIT;

    audioRow.appendChild(audio);
    audioRow.appendChild(plays);

    const h2=document.createElement('h2');
    h2.textContent='Question '+(i+1)+' : '+q.question;

    const opts=document.createElement('div');
    opts.className='options';

    q.options.slice(0,4).forEach((o,j)=>{
      const label=document.createElement('label');
      label.className='option';
      const input=document.createElement('input');
      input.type='radio';
      input.name='q'+i;
      input.value=j;
      label.appendChild(input);
      label.appendChild(document.createTextNode(' '+o));
      opts.appendChild(label);
    });

    card.appendChild(audioRow);
    card.appendChild(h2);
    card.appendChild(opts);
    quiz.appendChild(card);

    audio.addEventListener('play',()=>{
      if(playCounts[i] >= PLAY_LIMIT){
        audio.pause();
        audio.currentTime=0;
      }
    });
    audio.addEventListener('ended',()=>{
      playCounts[i]++;
      plays.textContent='Écoutes : '+playCounts[i]+' / '+PLAY_LIMIT;
      if(playCounts[i] >= PLAY_LIMIT) audio.controls=false;
    });
    audio.addEventListener('error',()=>{
      plays.textContent='Erreur : le fichier audio n’est pas disponible.';
    });
  });
}

async function submitQuiz(){
  const studentName=document.getElementById('studentName').value.trim();
  if(!studentName){
    alert('Veuillez écrire votre nom avant de voir le résultat.');
    document.getElementById('studentName').focus();
    return;
  }
  submitBtn.disabled=true;

  const answers={};
  QUESTION_BANK.forEach((q,i)=>{
    const chosen=document.querySelector('input[name="q'+i+'"]:checked');
    answers[q.id] = chosen ? Number(chosen.value) : null;
  });

  const r=await sb.rpc('grade_submission',{p_test_id:TEST_ID,p_student_name:studentName,p_answers:answers});
  if(r.error){
    submitBtn.disabled=false;
    alert(r.error.message);
    return;
  }

  const data=r.data || {};
  const details=Array.isArray(data.details) ? data.details : [];

  // Normalize the server result using the safe published question data.
  // This fixes missing answer text and ensures an unanswered question is never marked correct.
  let computedScore=0;
  const normalizedDetails=details.map(d=>{
    const q=QUESTION_BANK.find(x=>String(x.id)===String(d.question_id));
    const options=q && Array.isArray(q.options) ? q.options : [];
    const selectedIndex=(d.selected_index === null || d.selected_index === undefined || d.selected_index === '')
      ? null : Number(d.selected_index);
    const correctIndex=Number(d.correct_index);
    const validSelected=Number.isInteger(selectedIndex) && selectedIndex>=0 && selectedIndex<4;
    const ok=validSelected && Number.isInteger(correctIndex) && selectedIndex===correctIndex;
    if(ok) computedScore++;
    return {
      ...d,
      selected_index:selectedIndex,
      correct_index:correctIndex,
      selected_text:validSelected ? options[selectedIndex] : null,
      correct_text:(Number.isInteger(correctIndex) && correctIndex>=0 && correctIndex<4) ? options[correctIndex] : null,
      correct:ok
    };
  });

  const total=normalizedDetails.length || QUESTION_BANK.length;
  const score=computedScore;
  const percentage=total ? Math.round((score*10000/total))/100 : 0;

  result.style.display='block';
  result.innerHTML='';
  const scoreBox=document.createElement('div');
  scoreBox.className='score';
  scoreBox.textContent='Résultat : '+score+' / '+total+' ('+percentage+' %)';
  result.appendChild(scoreBox);

  const p=document.createElement('p');
  p.textContent='Élève : '+studentName;
  result.appendChild(p);

  normalizedDetails.forEach(d=>{
    const review=document.createElement('div');
    review.className='review';
    const ok=d.correct===true;
    const title=document.createElement('div');
    title.innerHTML='<strong>Question '+esc(d.position)+'</strong> — <span class="'+(ok?'correct':'wrong')+'">'+(ok?'✓ Bonne réponse':'✗ Mauvaise réponse')+'</span>';
    review.appendChild(title);

    const yours=document.createElement('div');
    yours.textContent='Votre réponse : '+(d.selected_text ?? 'Aucune réponse');
    review.appendChild(yours);

    const right=document.createElement('div');
    right.textContent='Bonne réponse : '+(d.correct_text ?? '—');
    review.appendChild(right);

    const sentence=document.createElement('div');
    sentence.className='sentence';
    let correctSentence=String(d.correct_sentence ?? '');
    correctSentence=correctSentence.replace(/^Phrase correcte\s*:?[\s]*/i, '');
    sentence.textContent='Phrase correcte : '+correctSentence;
    review.appendChild(sentence);

    result.appendChild(review);
  });

  result.scrollIntoView({behavior:'smooth',block:'start'});
}

submitBtn.addEventListener('click',submitQuiz);

loadTest().catch(err=>showError('Impossible de charger le test : '+err.message));
</script>
</body>
</html>
